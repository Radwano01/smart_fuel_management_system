server:
  port: 8100

spring:
  application:
    name: payment


  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: radwan
    password: password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

stripe:
  public-key:
  secret-key:
  webhook:
    secret:

payment:
  provider: stripe
  timeout-ms: 5000
  currency:
  retry:
    max-attempts: 3

features:
  enable-preauth: true
  enable-auto-capture: true

jwt:
  secret: 
  expiration: 900000