server:
  port: 8040

spring:
  application:
    name: transaction

  datasource:
    url: jdbc:postgresql://localhost:5432/transactions
    username: radwan
    password: password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

jwt:
  secret: 
  expiration: 900000   # 15 minutes (in milliseconds)