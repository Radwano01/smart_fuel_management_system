server:
  port: 8020

spring:
  application:
    name: station

  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: jdbc:postgresql://localhost:5432/stations
    username: radwan
    password: password

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  sql:
    init:
      mode: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

jwt:
  secret: 
  expiration: 900000

mqtt:
  broker-uri: tcp://localhost:1883
  client-id: station-service
  username: guest
  password: guest
  clean-session: true
  connection-timeout: 10s
  keep-alive-interval: 30s
  default-qos: 1
  persistence-directory: target/mqtt/station
  reconnect:
    initial-delay: 2s
    max-delay: 30s
  topics:
    heartbeat: fuel/pump
    registration: smartfuel/devices/register
    registration-response: smartfuel/devices/response